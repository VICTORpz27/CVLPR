<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administration — CVL Pierre Rouges</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin.css"></head><body><main class="admin-main"><header class="admin-top"><a href="/">Boîte à idées · CVL Pierre Rouges</a><button id="logout" class="small" hidden>Déconnexion</button></header><section id="auth" class="panel auth"><h1>Accès CVL</h1><p>Connectez-vous pour consulter les suggestions.</p><form id="login-form"><label for="username">Identifiant</label><input id="username" autocomplete="username" required><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required><button class="primary">Se connecter</button></form><p id="login-message" role="status"></p></section><section id="setup" class="panel auth" hidden><h1>Initialiser le CVL</h1><p>Première installation uniquement : créez le compte Super Admin.</p><form id="setup-form"><label for="secret">Clé SETUP_SECRET</label><input id="secret" type="password" required><label for="setup-user">Identifiant</label><input id="setup-user" required><label for="setup-password">Mot de passe (12 caractères minimum)</label><input id="setup-password" type="password" minlength="12" required><button class="primary">Créer le Super Admin</button></form><p id="setup-message" role="status"></p></section><section id="dashboard" hidden><div class="dash-heading"><div><h1>Tableau de bord</h1><p id="welcome"></p></div></div><div id="stats" class="stats"></div><div class="panel"><div class="row"><h2>Suggestions</h2><select id="filter"><option value="">Toutes</option><option value="approved">Retenues</option><option value="review">À vérifier</option><option value="spam">Spam</option><option value="duplicate">Doublons</option></select></div><div id="suggestions" class="suggestions"></div></div><div class="panel" id="users-panel" hidden><div class="row"><h2>Comptes CVL</h2><button id="reload-users" class="small">Actualiser</button></div><div id="users"></div><h3>Ajouter un membre</h3><form id="new-user"><div class="three"><div><label for="new-username">Identifiant</label><input id="new-username" required></div><div><label for="new-password">Mot de passe initial</label><input id="new-password" type="password" minlength="12" required></div><div><label for="new-role">Rôle</label><select id="new-role"><option value="reader">Lecteur</option><option value="member">Membre</option><option value="admin">Admin</option></select></div></div><button class="primary">Créer le compte</button></form><p id="users-message" role="status"></p></div></section></main><script src="/admin.js" defer></script></body></html>
